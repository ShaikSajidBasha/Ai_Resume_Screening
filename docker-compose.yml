version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: resume_screening_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Sajid@2005
      MYSQL_DATABASE: ResumeScreening
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: resume_screening_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql:3306/resume_screening_db
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: resume_screening_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  mysql_data:
